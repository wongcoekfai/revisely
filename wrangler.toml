name = "revisely"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 (SQLite) binding.
# For LOCAL dev this works out of the box. For REMOTE deploy, replace the
# placeholder database_id with the id printed by:  wrangler d1 create revisely
[[d1_databases]]
binding = "DB"
database_name = "revisely"
database_id = "REPLACE_WITH_YOUR_D1_ID"
